name: Publish to PyPI

# Builds the sdist + wheel and publishes memgraph-widget to PyPI using PyPI
# Trusted Publishing (OIDC) — no API token to store. Configure the trusted
# publisher on PyPI first (see MemGraph/README.md → "Publish to PyPI").
#
# Triggers on a version tag (v1.1.0, …) or manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MemGraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: MemGraph/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the PyPI trusted-publisher config
    permissions:
      id-token: write          # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
