name: Build MemGraph (Windows)

# Builds the widget on a real Windows runner, runs the tests, and publishes
# MemGraph.exe as a downloadable artifact. Triggers on changes under MemGraph/
# and can be run on demand from the Actions tab.

on:
  push:
    branches: ["**"]
    paths:
      - "MemGraph/**"
      - ".github/workflows/build-memgraph.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish MemGraph.exe as a Release asset

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MemGraph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm MemGraph.spec

      - name: Upload MemGraph-Setup.exe (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MemGraph-windows
          path: MemGraph/dist/MemGraph-Setup.exe
          if-no-files-found: error

      # Publish the installer as a Release asset so it has a stable, login-free
      # direct-download URL:
      #   https://github.com/<owner>/<repo>/releases/download/memgraph-latest/MemGraph-Setup.exe
      - name: Publish MemGraph-Setup.exe to a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate a moving "memgraph-latest" release pointing at this commit.
          gh release delete memgraph-latest --yes --cleanup-tag || true
          gh release create memgraph-latest dist/MemGraph-Setup.exe \
            --target "${{ github.sha }}" \
            --title "MemGraph (latest build)" \
            --notes "MemGraph installer for Windows. Download **MemGraph-Setup.exe**, run it, and the setup UI installs the widget (no admin rights)."
